repos:
  - repo: local
    hooks:
      - id: zig-fmt
        name: zig fmt
        entry: zig fmt --check
        language: system
        files: '\.zig$'
        # zig-pkg/ is fetched cache, vendor/ is third-party code kept diffable
        # against upstream: neither is formatted by us.
        exclude: '^(zig-pkg|vendor)/'
        pass_filenames: true
